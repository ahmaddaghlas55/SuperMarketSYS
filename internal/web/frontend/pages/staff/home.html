<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <title>الرئيسية</title>
  <link rel="manifest" href="/public/manifest.json">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body>
  <main id="app">
    <div class="app-shell">
      <header class="page-header">
        <div>
          <h1 id="welcome">مرحباً</h1>
          <p class="muted">اختر إجراءً للبدء</p>
        </div>
        <button class="btn btn-ghost" id="logout">تسجيل الخروج</button>
      </header>
      <div class="circle-grid">
        <a class="circle-tile" href="/staff/checkout">
          <span class="circle">🛒</span><span class="tile-label">مبيعة جديدة</span>
        </a>
        <a class="circle-tile" href="/staff/debt">
          <span class="circle">💳</span><span class="tile-label">ديون العملاء</span>
        </a>
        <a class="circle-tile" href="/staff/cash-register">
          <span class="circle">🗄️</span><span class="tile-label">الصندوق</span>
          <span class="tile-badge hidden" id="cash-badge">لم يفتح بعد</span>
        </a>
        <a class="circle-tile" href="/staff/dealer-receipt">
          <span class="circle">📦</span><span class="tile-label">إيصال مورد</span>
        </a>
      </div>
    </div>
  </main>
  <script type="module" src="/js/pages/staff-home.js"></script>
</body>

</html>
