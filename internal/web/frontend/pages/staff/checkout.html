<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
    <title>مبيعة جديدة</title>
    <link rel="manifest" href="/public/manifest.json">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
</head>

<body>
    <main id="app">
        <div class="app-shell">
            <header class="page-header">
                <div>
                    <h1>مبيعة جديدة</h1>
                    <p class="muted">ابحث أو امسح باركود المنتج</p>
                </div><a class="btn btn-ghost" href="/staff/home">الرئيسية</a>
            </header>
            <section class="master-detail">
                <aside class="surface panel stack"><input id="search" class="input" placeholder="اسم المنتج أو الباركود"
                        autofocus>
                    <div id="matches" class="list"></div>
                    <div id="detail" class="stack"></div>
                </aside>
                <main class="surface panel stack">
                    <div class="page-header">
                        <h2>السلة</h2><button class="btn btn-danger" id="clear">تفريغ</button>
                    </div>
                    <div id="cart" class="list"></div>
                    <div id="summary"></div>
                </main>
            </section>
        </div>
    </main>
    <script type="module" src="/js/core/auth.js"></script>
    <script type="module" src="/js/pages/checkout.js"></script>
</body>

</html>
