<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <title>تسجيل الدخول</title>
  <link rel="manifest" href="/public/manifest.json">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body>
  <main id="app">
    <div class="app-shell">
      <section id="user-select">
        <header class="page-header">
          <div>
            <h1>من أنت؟</h1>
            <p class="muted">اختر اسمك للمتابعة</p>
          </div>
        </header>
        <div class="circle-grid" id="circle-grid"></div>
      </section>

      <section id="password-screen" class="password-screen hidden">
  <button class="btn btn-ghost" id="back-btn">رجوع</button>
  <div class="circle" id="password-avatar"></div>
  <h2 id="password-name"></h2>
  <div class="pin-dots" id="pin-dots"></div>
  <p class="error-text" id="password-error"></p>
  <div class="pin-pad" id="pin-pad">
    <button class="pin-key" data-key="1">1</button>
    <button class="pin-key" data-key="2">2</button>
    <button class="pin-key" data-key="3">3</button>
    <button class="pin-key" data-key="4">4</button>
    <button class="pin-key" data-key="5">5</button>
    <button class="pin-key" data-key="6">6</button>
    <button class="pin-key" data-key="7">7</button>
    <button class="pin-key" data-key="8">8</button>
    <button class="pin-key" data-key="9">9</button>
    <button class="pin-key pin-key-action" data-key="back">⌫</button>
    <button class="pin-key" data-key="0">0</button>
    <button class="pin-key pin-key-action pin-key-submit" data-key="submit">✓</button>
  </div>
</section>
    </div>
  </main>
  <script type="module" src="/js/pages/login.js"></script>
</body>

</html>
