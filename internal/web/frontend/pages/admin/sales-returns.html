<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"><title>مرتجعات المبيعات</title><link rel="manifest" href="/public/manifest.json"><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/components.css"></head><body><main id="app"><div class="app-shell"><header class="page-header"><h1>مرتجعات المبيعات</h1><a class="btn btn-ghost" href="/admin/all-returns">كل المرتجعات</a></header><section class="surface panel"><form id="form" class="stack"><label class="label">رقم البيع<input class="input" name="sale_id" type="number" min="1" required></label><label class="label">نوع المعالجة<select class="select" name="refund_type"><option value="debt_removed">إزالة من الدين</option><option value="cash_refund">استرداد نقدي</option><option value="exchange">استبدال</option></select></label><label class="label">المنتج<select class="select" name="product_id"></select></label><label class="label">الكمية<input class="input" name="quantity" type="number" min="0.01" step="0.01" required></label><label class="label">ملاحظات<textarea class="input" name="notes"></textarea></label><button class="btn btn-primary">تسجيل المرتجع</button><div id="message"></div></form></section></div></main><script type="module" src="/js/core/auth.js"></script><script type="module" src="/js/pages/sales-returns.js"></script></body></html>
