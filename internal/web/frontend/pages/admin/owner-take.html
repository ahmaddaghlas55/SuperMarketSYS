<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>سحب المالك</title>
    <link rel="manifest" href="/public/manifest.json">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
</head>

<body>
    <main id="app">
        <div class="app-shell">
            <header class="page-header">
                <h1>سحب المالك من المخزون</h1><a class="btn btn-ghost" href="/admin/dashboard">لوحة التحكم</a>
            </header>
            <section class="surface panel">
                <form id="form" class="stack"><label class="label">المنتج<select class="select"
                            name="product_id"></select></label><label class="label">الكمية<input class="input"
                            name="quantity" type="number" min="0.01" step="0.01" required></label><label
                        class="label">ملاحظات<textarea class="input" name="notes"></textarea></label><button
                        class="btn btn-primary">تسجيل السحب</button>
                    <div id="message"></div>
                </form>
            </section>
        </div>
    </main>
    <script type="module" src="/js/core/auth.js"></script>
    <script type="module" src="/js/pages/owner-take.js"></script>
</body>

</html>
